<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Illustration: the Freedom Plan workbook — summary, ledger, schedule, scenarios, budget, war chest, house rules">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="url(#sky2)"/>
  <!-- workbook card -->
  <g font-family="-apple-system,Helvetica,Arial,sans-serif">
    <rect x="80" y="80" width="680" height="460" rx="22" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="80" y="80" width="680" height="60" rx="22" fill="#0071e3"/>
    <text x="114" y="119" font-size="24" font-weight="700" fill="#ffffff">Your Freedom Plan workbook</text>
    <g font-size="21" fill="#1d1d1f">
      <rect x="114" y="168" width="180" height="44" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/><text x="132" y="197">Summary</text>
      <rect x="310" y="168" width="180" height="44" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/><text x="328" y="197">Debt Ledger</text>
      <rect x="506" y="168" width="220" height="44" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/><text x="524" y="197">Payoff Schedule</text>
      <rect x="114" y="228" width="180" height="44" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/><text x="132" y="257">Scenarios</text>
      <rect x="310" y="228" width="220" height="44" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/><text x="328" y="257">Monthly Budget</text>
      <rect x="546" y="228" width="180" height="44" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/><text x="564" y="257">War Chest</text>
      <rect x="114" y="288" width="180" height="44" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/><text x="132" y="317">House Rules</text>
    </g>
    <g stroke="#e8e8ec" stroke-width="2">
      <line x1="114" y1="372" x2="726" y2="372"/><line x1="114" y1="412" x2="726" y2="412"/><line x1="114" y1="452" x2="726" y2="452"/><line x1="114" y1="492" x2="726" y2="492"/>
    </g>
    <g fill="#34c759">
      <circle cx="130" cy="352" r="6"/><circle cx="130" cy="392" r="6"/><circle cx="130" cy="432" r="6"/><circle cx="130" cy="472" r="6"/>
    </g>
    <g fill="#e8e8ec">
      <rect x="152" y="343" width="380" height="16" rx="8"/><rect x="152" y="383" width="320" height="16" rx="8"/><rect x="152" y="423" width="420" height="16" rx="8"/><rect x="152" y="463" width="280" height="16" rx="8"/>
    </g>
  </g>
  <!-- calendar card -->
  <g font-family="-apple-system,Helvetica,Arial,sans-serif">
    <rect x="812" y="150" width="308" height="320" rx="22" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="812" y="150" width="308" height="58" rx="22" fill="#1d1d1f"/>
    <text x="842" y="188" font-size="22" font-weight="700" fill="#ffffff">Your date</text>
    <circle cx="966" cy="318" r="72" fill="none" stroke="#0a7d3b" stroke-width="7"/>
    <text x="966" y="308" text-anchor="middle" font-size="25" font-weight="700" fill="#1d1d1f">DEBT-</text>
    <text x="966" y="342" text-anchor="middle" font-size="25" font-weight="700" fill="#1d1d1f">FREE</text>
    <text x="966" y="428" text-anchor="middle" font-size="20" fill="#6e6e73">picked by you,</text>
    <text x="966" y="454" text-anchor="middle" font-size="20" fill="#6e6e73">modeled month by month</text>
  </g>
</svg>
